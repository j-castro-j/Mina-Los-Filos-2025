<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Visor 3D - Mina Los Filos - Marzo 2025</title>
  
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.115/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background-color: #121519; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    /* Barra Superior */
    .top-bar { position: absolute; top: 16px; left: 16px; z-index: 10; background: rgba(18, 21, 25, 0.90); backdrop-filter: blur(8px); padding: 10px 14px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.12); color: #f0f3f6; display: flex; align-items: center; gap: 10px; box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
    .top-bar h1 { margin: 0 10px 0 0; font-size: 15px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: #58a6ff; white-space: nowrap; }
    
    /* Botones */
    .nav-btn { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); color: #e6edf3; padding: 7px 14px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
    .nav-btn:hover { background: #1f6feb; border-color: #58a6ff; }
    .nav-btn-camera { background: rgba(88, 166, 255, 0.18); border-color: #58a6ff; color: #58a6ff; }
    .nav-btn-camera:hover { background: #1f6feb; color: #fff; }

    /* Brújula Superior Derecha */
    .compass-card { position: absolute; top: 16px; right: 16px; z-index: 10; width: 110px; height: 110px; background: rgba(18, 21, 25, 0.90); backdrop-filter: blur(8px); border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.18); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,0.5); transition: border-color 0.2s, transform 0.15s; }
    .compass-card:hover { border-color: #58a6ff; transform: scale(1.04); }
    .compass-svg { width: 75px; height: 75px; transform-origin: 50% 50%; will-change: transform; }

    @media (max-width: 768px) {
      .top-bar { top: 10px; left: 10px; right: 10px; padding: 10px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
      .compass-card { width: 80px; height: 80px; top: auto; bottom: 85px; right: 10px; }
      .compass-svg { width: 55px; height: 55px; }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <h1>Mina Los Filos - Marzo 2025</h1>
    <button class="nav-btn" onclick="topView()">Planta (2D)</button>
    <button class="nav-btn" onclick="perspectiveView()">Perspectiva 3D</button>
    <button class="nav-btn nav-btn-camera" onclick="takeExecutiveScreenshot()">📸 Captura</button>
  </div>

  <div class="compass-card" title="Clic para orientar al Norte" onclick="orientToNorth()">
    <svg class="compass-svg" id="compassNeedle" viewBox="0 0 36 36">
      <text x="18" y="5.5" font-size="6" font-weight="900" fill="#f85149" text-anchor="middle">N</text>
      <polygon points="18,7 22,18 18,15.5 14,18" fill="#f85149" />
      <polygon points="18,29 22,18 18,20.5 14,18" fill="#8b949e" />
      <circle cx="18" cy="18" r="2.5" fill="#f0f3f6" />
    </svg>
  </div>

  <div id="cesiumContainer"></div>

  <script>
    // =========================================================================
    // 1. CONFIGURACIÓN
    // =========================================================================
    Cesium.Ion.defaultAccessToken = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6IldyMzE1Y3hPYS1pQTMzTVoiLCJqdGkiOiJiZjFlYjM3Ny0wMTY0LTRjYTEtYTdhNy02MWFmNTJmYzliNmEiLCJpZCI6NDk4OTI5LCJzdWIiOiJqY2FzdHJvamltZW5leiIsImlzcyI6Imh0dHBzOi8vYXBpLmNlc2l1bS5jb20iLCJhdWQiOiJNaW5hIENvbXBsZXRhIiwiaWF0IjoxNzkwMDI3MTc3fQ.U4AvaBIYgNOTAKv8IpOiHHoPdZBzWHzjMj_bAV1LOeU";
    const ASSET_ID = 5890546; // <--- REEMPLAZA CON EL ASSET ID DEL MODELO

    // =========================================================================
    // 2. INICIALIZACIÓN DEL VISOR
    // =========================================================================
    const viewer = new Cesium.Viewer('cesiumContainer', {
      baseLayer: false, imageryProvider: false, 
      contextOptions: { webgl: { preserveDrawingBuffer: true } }, // Requerido para la captura
      timeline: false, animation: false, baseLayerPicker: false, 
      geocoder: false, homeButton: false, sceneModePicker: false, 
      navigationHelpButton: false, infoBox: false, selectionIndicator: false
    });
    
    viewer.scene.globe.show = false;
    viewer.scene.backgroundColor = Cesium.Color.fromCssColorString('#121519');

    // =========================================================================
    // 3. CARGA DE LA MALLA
    // =========================================================================
    let currentTileset = null;
    Cesium.Cesium3DTileset.fromIonAssetId(ASSET_ID, { maximumScreenSpaceError: 2 })
    .then(function(tileset) {
      currentTileset = tileset; 
      viewer.scene.primitives.add(tileset); 
      perspectiveView();
    });

    // =========================================================================
    // 4. CÁMARA Y BRÚJULA
    // =========================================================================
    function topView() { if (currentTileset) viewer.zoomTo(currentTileset, new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(-89.9), 0)); }
    function perspectiveView() { if (currentTileset) viewer.zoomTo(currentTileset, new Cesium.HeadingPitchRange(Cesium.Math.toRadians(45), Cesium.Math.toRadians(-35), 0)); }
    function orientToNorth() { viewer.camera.flyTo({ destination: viewer.camera.position, orientation: { heading: 0.0, pitch: viewer.camera.pitch, roll: 0.0 }, duration: 0.7 }); }

    // Actualizar la Brújula HTML
    const needle = document.getElementById('compassNeedle');
    let lastHeading = null;
    viewer.scene.postRender.addEventListener(function() { 
      const currentHeading = viewer.camera.heading;
      if (lastHeading === null || Math.abs(lastHeading - currentHeading) > 0.005) {
        needle.style.transform = `rotate(${-Cesium.Math.toDegrees(currentHeading)}deg)`; 
        lastHeading = currentHeading;
      }
    });

    // =========================================================================
    // 5. CAPTURA DE PANTALLA EJECUTIVA (UI ESTAMPADA)
    // =========================================================================
    function takeExecutiveScreenshot() {
      viewer.render(); // Forzar renderizado
      
      // Crear un lienzo temporal para componer la imagen final
      const canvas2d = document.createElement('canvas');
      canvas2d.width = viewer.canvas.width;
      canvas2d.height = viewer.canvas.height;
      const ctx = canvas2d.getContext('2d');
      
      // 1. Dibujar el modelo 3D de fondo
      ctx.drawImage(viewer.canvas, 0, 0);

      // Ajustar escala para monitores de alta resolución (Retina/4K)
      const ratio = viewer.canvas.width / viewer.canvas.clientWidth;
      ctx.scale(ratio, ratio);
      const cw = viewer.canvas.clientWidth;
      const ch = viewer.canvas.clientHeight;

      // 2. Estampar el Título Superior
      ctx.fillStyle = 'rgba(18, 21, 25, 0.85)';
      ctx.beginPath(); ctx.roundRect(16, 16, 275, 42, 6); ctx.fill();
      ctx.fillStyle = '#58a6ff';
      ctx.font = 'bold 15px sans-serif';
      ctx.fillText('MINA LOS FILOS - MARZO 2025', 28, 43);

      // 3. Estampar la Brújula en la esquina superior derecha
      ctx.save();
      ctx.translate(cw - 71, 71); // Posición (Radio 55px + 16px margen)
      ctx.fillStyle = 'rgba(18, 21, 25, 0.85)';
      ctx.beginPath(); ctx.arc(0, 0, 55, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 2; ctx.stroke();
      
      ctx.rotate(-viewer.camera.heading); // Rotar según la cámara actual
      
      // Dibujar aguja de la brújula
      ctx.fillStyle = '#f85149'; // Rojo (Norte)
      ctx.beginPath(); ctx.moveTo(0, -35); ctx.lineTo(10, 0); ctx.lineTo(-10, 0); ctx.fill();
      ctx.fillStyle = '#8b949e'; // Gris (Sur)
      ctx.beginPath(); ctx.moveTo(0, 35); ctx.lineTo(10, 0); ctx.lineTo(-10, 0); ctx.fill();
      ctx.fillStyle = '#f0f3f6'; // Centro
      ctx.beginPath(); ctx.arc(0, 0, 3, 0, Math.PI*2); ctx.fill();
      
      // Letra N
      ctx.fillStyle = '#f85149'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('N', 0, -42);
      ctx.restore();

      // 4. Descargar la imagen procesada
      const link = document.createElement('a');
      link.download = `Mina_Los_Filos_Marzo_2025.png`;
      link.href = canvas2d.toDataURL('image/png');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
